<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repaso Universal de Test</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%230d6efd'>🇬🇧</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <main class="app">
    <section class="panel header" id="headerPanel">
      <div class="title-row">
        <h1>Repaso Universal de Test (data.json)</h1>
        <span id="datasetName" class="muted">Fuente: data.json</span>
      </div>

      <div class="score-grid">
        <div class="score-box">
          <span class="score-label">Pregunta</span>
          <span id="scoreQuestion" class="score-value">0/0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Acertadas</span>
          <span id="scoreCorrect" class="score-value">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Falladas</span>
          <span id="scoreWrong" class="score-value">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Puntuacion</span>
          <span id="scorePercent" class="score-value">0%</span>
        </div>
      </div>

      <div class="actions">
        <label class="file-label btn-secondary" for="jsonFileInput">Cargar otro data.json</label>
        <input id="jsonFileInput" type="file" accept="application/json" />
        <button id="resetBtn" class="btn-secondary" type="button">Reiniciar test</button>
        <button id="downloadPdfBtn" class="btn-primary" type="button">Descargar preguntas en PDF</button>
      </div>
      
      <button id="toggleHeaderBtn" class="toggle-header" type="button" aria-label="Expandir/Contraer resumen">
        📊 Ver resumen
      </button>
      
      <p id="statusLine" class="muted" role="status" aria-live="polite">Cargando preguntas...</p>
    </section>

    <section class="panel quiz" id="quizPanel" hidden>
      <div class="question-head">
        <div class="chips">
          <span id="chipCounter" class="chip">Pregunta 0 de 0</span>
          <span id="chipPage" class="chip">Pagina original: -</span>
        </div>
      </div>

      <div class="progress-wrap" aria-label="Progreso del test">
        <div id="progressLabel" class="progress-label">0% completado</div>
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <p id="questionText" class="question-text"></p>
      <div id="optionsContainer" class="options" role="radiogroup" aria-label="Opciones de respuesta"></div>
      <div id="feedbackBox" class="feedback" role="status" aria-live="polite" hidden></div>
      <div id="finalSummary" class="summary-box" role="status" aria-live="polite" hidden></div>

      <div class="nav">
        <button id="prevBtn" class="btn-secondary" type="button">Anterior</button>
        <button id="nextBtn" class="btn-secondary" type="button">Siguiente</button>
      </div>
    </section>

    <section class="panel history">
      <div class="title-row">
        <h2 style="margin:0;font-size:1.05rem;">Resumenes guardados</h2>
        <button id="clearHistoryBtn" class="btn-secondary" type="button">Borrar historial</button>
      </div>
      <div id="historyContainer" class="history-list"></div>
      <div id="historySummary" class="empty">Selecciona una ejecucion para ver su resumen.</div>
    </section>
  </main>

  <nav class="navigator-panel" id="navigatorPanel">
    <div class="navigator-header">
      <h3>Ir a pregunta</h3>
      <button class="close-nav" id="closeNavBtn" type="button" aria-label="Cerrar navegador">✕</button>
    </div>
    <div class="navigator-content">
      <div class="navigator-grid" id="navigatorGrid"></div>
    </div>
  </nav>

  <button class="toggle-nav" id="toggleNavBtn" type="button" aria-label="Mostrar/ocultar navegador de preguntas">📋</button>

  <script src="js/script.js"></script>
</body>
</html>
