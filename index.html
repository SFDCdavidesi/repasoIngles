<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repaso Universal de Test</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%230d6efd'>🇬🇧</text></svg>" />
  <style>
    :root {
      --bg: #f2f5f9;
      --card: #ffffff;
      --text: #16202a;
      --muted: #5d6b79;
      --line: #dbe4ee;
      --primary: #0d6efd;
      --primary-strong: #0a58ca;
      --ok-bg: #ecfdf3;
      --ok-line: #1f9d62;
      --bad-bg: #fff0f0;
      --bad-line: #d33c3c;
      --chip: #eef3f8;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(23, 42, 58, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #f8fbff 0%, var(--bg) 45%, #eaf1f8 100%);
      min-height: 100vh;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .header {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.3;
    }

    .muted {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .score-box {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f9fbfd;
      padding: 10px;
    }

    .score-label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 4px;
    }

    .score-value {
      font-weight: 700;
      font-size: 1rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button,
    .file-label {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.92rem;
      cursor: pointer;
      background: var(--chip);
      color: var(--text);
      transition: 0.2s ease;
    }

    button:hover,
    .file-label:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-strong);
    }

    .btn-secondary {
      background: #e8eef6;
      border-color: #d2deea;
    }

    .quiz {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .question-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--chip);
      border: 1px solid #d7e1eb;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 0.8rem;
      color: #3d4c5d;
    }

    .question-text {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.5;
      font-weight: 600;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      width: 100%;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      text-align: left;
      padding: 12px;
      font-size: 0.97rem;
      color: var(--text);
      cursor: pointer;
    }

    .option.selected {
      border-color: #7aaef6;
      background: #f3f8ff;
    }

    .option.correct {
      border-color: var(--ok-line);
      background: var(--ok-bg);
    }

    .option.wrong {
      border-color: var(--bad-line);
      background: var(--bad-bg);
    }

    .feedback {
      border-radius: 10px;
      padding: 10px;
      font-size: 0.92rem;
      border: 1px solid transparent;
    }

    .feedback.ok {
      background: var(--ok-bg);
      border-color: #9fd8bb;
      color: #0e5d3b;
    }

    .feedback.bad {
      background: var(--bad-bg);
      border-color: #f1b8b8;
      color: #842222;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .history {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .history-list {
      display: grid;
      gap: 8px;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: #f9fbfd;
    }

    .small {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .empty {
      border: 1px dashed #c9d6e4;
      border-radius: 10px;
      padding: 12px;
      color: var(--muted);
      background: #fafcff;
    }

    input[type="file"] {
      display: none;
    }

    @media (max-width: 900px) {
      .score-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .app {
        padding: 12px;
      }

      h1 {
        font-size: 1.15rem;
      }

      .score-grid {
        grid-template-columns: 1fr;
      }

      .option {
        padding: 10px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <main class="app">
    <section class="panel header">
      <div class="title-row">
        <h1>Repaso Universal de Test (data.json)</h1>
        <span id="datasetName" class="muted">Fuente: data.json</span>
      </div>

      <div class="score-grid">
        <div class="score-box">
          <span class="score-label">Pregunta</span>
          <span id="scoreQuestion" class="score-value">0/0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Acertadas</span>
          <span id="scoreCorrect" class="score-value">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Falladas</span>
          <span id="scoreWrong" class="score-value">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Puntuacion</span>
          <span id="scorePercent" class="score-value">0%</span>
        </div>
      </div>

      <div class="actions">
        <label class="file-label btn-secondary" for="jsonFileInput">Cargar otro data.json</label>
        <input id="jsonFileInput" type="file" accept="application/json" />
        <button id="resetBtn" class="btn-secondary" type="button">Reiniciar test</button>
        <button id="downloadPdfBtn" class="btn-primary" type="button">Descargar preguntas en PDF</button>
      </div>
      <p id="statusLine" class="muted">Cargando preguntas...</p>
    </section>

    <section class="panel quiz" id="quizPanel" hidden>
      <div class="question-head">
        <div class="chips">
          <span id="chipCounter" class="chip">Pregunta 0 de 0</span>
          <span id="chipPage" class="chip">Pagina original: -</span>
        </div>
      </div>

      <p id="questionText" class="question-text"></p>
      <div id="optionsContainer" class="options"></div>
      <div id="feedbackBox" class="feedback" hidden></div>

      <div class="nav">
        <button id="prevBtn" class="btn-secondary" type="button">Anterior</button>
        <button id="nextBtn" class="btn-secondary" type="button">Siguiente</button>
      </div>
    </section>

    <section class="panel history">
      <div class="title-row">
        <h2 style="margin:0;font-size:1.05rem;">Resumenes guardados en cookies</h2>
        <button id="clearHistoryBtn" class="btn-secondary" type="button">Borrar historial</button>
      </div>
      <div id="historyContainer" class="history-list"></div>
      <div id="historySummary" class="empty">Selecciona una ejecucion para ver su resumen.</div>
    </section>
  </main>

  <script>
    const HISTORY_COOKIE = "quiz_history_v1";
    const HISTORY_MAX = 12;

    const state = {
      datasetName: "data.json",
      questions: [],
      currentIndex: 0,
      answers: [],
      finished: false,
      startedAt: null
    };

    const el = {
      datasetName: document.getElementById("datasetName"),
      statusLine: document.getElementById("statusLine"),
      scoreQuestion: document.getElementById("scoreQuestion"),
      scoreCorrect: document.getElementById("scoreCorrect"),
      scoreWrong: document.getElementById("scoreWrong"),
      scorePercent: document.getElementById("scorePercent"),
      jsonFileInput: document.getElementById("jsonFileInput"),
      resetBtn: document.getElementById("resetBtn"),
      downloadPdfBtn: document.getElementById("downloadPdfBtn"),
      quizPanel: document.getElementById("quizPanel"),
      chipCounter: document.getElementById("chipCounter"),
      chipPage: document.getElementById("chipPage"),
      questionText: document.getElementById("questionText"),
      optionsContainer: document.getElementById("optionsContainer"),
      feedbackBox: document.getElementById("feedbackBox"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      historyContainer: document.getElementById("historyContainer"),
      historySummary: document.getElementById("historySummary"),
      clearHistoryBtn: document.getElementById("clearHistoryBtn")
    };

    function normalizeText(value) {
      return String(value || "").trim().toLowerCase();
    }

    function getCorrectIndex(question) {
      if (!question || !Array.isArray(question.answers)) return -1;
      return question.answers.findIndex((a) => Boolean(a.selected));
    }

    function parseQuestion(raw, index) {
      const qText = String(raw.question || raw.qtext || raw.text || "").trim();
      const page = Number.isInteger(raw.page) ? raw.page : index;
      const answersRaw = Array.isArray(raw.answers) ? raw.answers : [];

      const answers = answersRaw.map((a) => {
        if (typeof a === "string") {
          return { text: a, selected: false };
        }
        return {
          text: String(a.text || a.answer || "").trim(),
          selected: Boolean(a.selected)
        };
      }).filter((a) => a.text.length > 0);

      return {
        page,
        question: qText,
        answers
      };
    }

    function sanitizeData(data) {
      const base = Array.isArray(data?.items)
        ? data.items
        : Array.isArray(data)
          ? data
          : [];

      const questions = base
        .map(parseQuestion)
        .filter((q) => q.question && q.answers.length >= 2)
        .map((q, idx) => ({ ...q, id: idx }));

      return questions;
    }

    function getStats() {
      const total = state.questions.length;
      let answered = 0;
      let correct = 0;

      state.answers.forEach((answerIndex, idx) => {
        if (answerIndex !== null && answerIndex !== undefined) {
          answered += 1;
          const correctIndex = getCorrectIndex(state.questions[idx]);
          if (correctIndex >= 0 && answerIndex === correctIndex) {
            correct += 1;
          }
        }
      });

      const wrong = answered - correct;
      const percent = answered > 0 ? Math.round((correct / answered) * 100) : 0;

      return { total, answered, correct, wrong, percent };
    }

    function updateScoreUI() {
      const stats = getStats();
      el.scoreQuestion.textContent = `${stats.answered}/${stats.total}`;
      el.scoreCorrect.textContent = String(stats.correct);
      el.scoreWrong.textContent = String(stats.wrong);
      el.scorePercent.textContent = `${stats.percent}%`;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "Fecha desconocida";
      return d.toLocaleString("es-ES");
    }

    function setCookie(name, value, days) {
      const date = new Date();
      date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
      document.cookie = `${name}=${encodeURIComponent(value)};expires=${date.toUTCString()};path=/;SameSite=Lax`;
    }

    function getCookie(name) {
      const key = `${name}=`;
      const parts = document.cookie.split(";").map((s) => s.trim());
      for (const p of parts) {
        if (p.indexOf(key) === 0) {
          return decodeURIComponent(p.substring(key.length));
        }
      }
      return "";
    }

    function deleteCookie(name) {
      document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;SameSite=Lax`;
    }

    function readHistory() {
      try {
        const raw = getCookie(HISTORY_COOKIE);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (_err) {
        return [];
      }
    }

    function writeHistory(items) {
      const compact = items.slice(0, HISTORY_MAX).map((i) => ({
        id: i.id,
        dataset: i.dataset,
        date: i.date,
        total: i.total,
        answered: i.answered,
        correct: i.correct,
        wrong: i.wrong,
        percent: i.percent,
        durationSec: i.durationSec
      }));
      setCookie(HISTORY_COOKIE, JSON.stringify(compact), 365);
    }

    function saveAttemptSummary() {
      const stats = getStats();
      if (stats.total === 0 || stats.answered === 0 || !state.startedAt) return;

      const durationSec = Math.max(1, Math.round((Date.now() - state.startedAt) / 1000));
      const item = {
        id: `attempt_${Date.now()}`,
        dataset: state.datasetName,
        date: new Date().toISOString(),
        total: stats.total,
        answered: stats.answered,
        correct: stats.correct,
        wrong: stats.wrong,
        percent: stats.percent,
        durationSec
      };

      const list = readHistory();
      list.unshift(item);
      writeHistory(list);
      renderHistory();
    }

    function renderHistorySummary(item) {
      el.historySummary.className = "empty";
      el.historySummary.innerHTML = `
        <strong>Resumen de ejecucion:</strong><br>
        Fecha: ${formatDate(item.date)}<br>
        Dataset: ${item.dataset}<br>
        Contestadas: ${item.answered}/${item.total}<br>
        Aciertos: ${item.correct} | Fallos: ${item.wrong}<br>
        Puntuacion: ${item.percent}%<br>
        Duracion: ${item.durationSec}s
      `;
    }

    function renderHistory() {
      const list = readHistory();
      el.historyContainer.innerHTML = "";

      if (list.length === 0) {
        el.historyContainer.innerHTML = `<div class="empty">No hay ejecuciones guardadas todavia.</div>`;
        return;
      }

      list.forEach((item) => {
        const row = document.createElement("div");
        row.className = "history-item";

        const left = document.createElement("div");
        left.innerHTML = `
          <strong>${item.dataset}</strong><br>
          <span class="small">${formatDate(item.date)} | ${item.correct}/${item.answered} | ${item.percent}%</span>
        `;

        const right = document.createElement("button");
        right.type = "button";
        right.className = "btn-secondary";
        right.textContent = "Ver resumen";
        right.addEventListener("click", () => renderHistorySummary(item));

        row.appendChild(left);
        row.appendChild(right);
        el.historyContainer.appendChild(row);
      });
    }

    function renderQuestion() {
      const q = state.questions[state.currentIndex];
      if (!q) {
        el.quizPanel.hidden = true;
        return;
      }

      const selectedIndex = state.answers[state.currentIndex];
      const correctIndex = getCorrectIndex(q);
      const hasAnswered = selectedIndex !== null && selectedIndex !== undefined;

      el.quizPanel.hidden = false;
      el.chipCounter.textContent = `Pregunta ${state.currentIndex + 1} de ${state.questions.length}`;
      el.chipPage.textContent = `Pagina original: ${q.page}`;
      el.questionText.textContent = q.question;
      el.optionsContainer.innerHTML = "";

      q.answers.forEach((ans, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.textContent = ans.text;

        if (hasAnswered) {
          if (idx === selectedIndex) btn.classList.add("selected");
          if (idx === correctIndex) btn.classList.add("correct");
          if (idx === selectedIndex && selectedIndex !== correctIndex) {
            btn.classList.add("wrong");
          }
        }

        btn.addEventListener("click", () => answerCurrent(idx));
        el.optionsContainer.appendChild(btn);
      });

      if (hasAnswered) {
        el.feedbackBox.hidden = false;
        if (selectedIndex === correctIndex && correctIndex >= 0) {
          el.feedbackBox.className = "feedback ok";
          el.feedbackBox.textContent = "Correcta. Muy bien.";
        } else {
          const rightText = correctIndex >= 0 ? q.answers[correctIndex].text : "No definida en data.json";
          el.feedbackBox.className = "feedback bad";
          el.feedbackBox.textContent = `Incorrecta. Respuesta correcta: ${rightText}`;
        }
      } else {
        el.feedbackBox.hidden = true;
      }

      el.prevBtn.disabled = state.currentIndex === 0;
      el.nextBtn.disabled = state.currentIndex === state.questions.length - 1;
      updateScoreUI();
    }

    function checkFinish() {
      const stats = getStats();
      if (stats.answered === stats.total && !state.finished) {
        state.finished = true;
        saveAttemptSummary();
        el.statusLine.textContent = `Test completado. Puntuacion final: ${stats.correct}/${stats.total} (${stats.percent}%).`;
      }
    }

    function answerCurrent(index) {
      if (!state.questions.length) return;
      state.answers[state.currentIndex] = index;
      renderQuestion();
      checkFinish();
    }

    function resetQuiz() {
      state.currentIndex = 0;
      state.answers = state.questions.map(() => null);
      state.finished = false;
      state.startedAt = Date.now();
      el.statusLine.textContent = `Test cargado con ${state.questions.length} preguntas.`;
      renderQuestion();
    }

    function loadQuestions(data, datasetLabel) {
      const parsed = sanitizeData(data);
      if (parsed.length === 0) {
        throw new Error("No se encontraron preguntas validas. Se espera un array en items con question y answers.");
      }

      state.questions = parsed;
      state.datasetName = datasetLabel || "data.json";
      el.datasetName.textContent = `Fuente: ${state.datasetName}`;
      resetQuiz();
    }

    async function loadDefaultJson() {
      const response = await fetch("data.json", { cache: "no-store" });
      if (!response.ok) {
        throw new Error("No se pudo cargar data.json. Verifica que exista en la carpeta del proyecto.");
      }
      const data = await response.json();
      loadQuestions(data, "data.json");
    }

    async function exportPdf() {
      if (!state.questions.length) return;
      const jspdfNs = window.jspdf;
      if (!jspdfNs || !jspdfNs.jsPDF) {
        alert("No se pudo cargar la libreria PDF.");
        return;
      }

      const { jsPDF } = jspdfNs;
      const doc = new jsPDF({ unit: "pt", format: "a4" });
      const margin = 40;
      const width = 515;
      let y = 50;

      function addLine(text, fontSize = 11, isBold = false) {
        doc.setFont("helvetica", isBold ? "bold" : "normal");
        doc.setFontSize(fontSize);
        const lines = doc.splitTextToSize(text, width);
        const needed = lines.length * (fontSize + 4);
        if (y + needed > 790) {
          doc.addPage();
          y = 50;
        }
        doc.text(lines, margin, y);
        y += needed + 4;
      }

      addLine("Repaso de preguntas", 15, true);
      addLine(`Fuente: ${state.datasetName}`, 10, false);
      addLine(`Generado: ${new Date().toLocaleString("es-ES")}`, 10, false);
      addLine(" ", 10, false);

      state.questions.forEach((q, idx) => {
        const selectedIndex = state.answers[idx];
        const correctIndex = getCorrectIndex(q);

        addLine(`${idx + 1}. ${q.question}`, 12, true);
        q.answers.forEach((ans, aIdx) => {
          const marks = [];
          if (aIdx === correctIndex) marks.push("Correcta");
          if (aIdx === selectedIndex) marks.push("Tu respuesta");
          const badge = marks.length ? ` [${marks.join(" | ")}]` : "";
          addLine(`   - ${ans.text}${badge}`, 10, false);
        });
        addLine(" ", 10, false);
      });

      doc.save("repaso_preguntas.pdf");
    }

    function wireEvents() {
      el.prevBtn.addEventListener("click", () => {
        if (state.currentIndex > 0) {
          state.currentIndex -= 1;
          renderQuestion();
        }
      });

      el.nextBtn.addEventListener("click", () => {
        if (state.currentIndex < state.questions.length - 1) {
          state.currentIndex += 1;
          renderQuestion();
        }
      });

      el.resetBtn.addEventListener("click", () => {
        if (!state.questions.length) return;
        resetQuiz();
      });

      el.downloadPdfBtn.addEventListener("click", exportPdf);

      el.jsonFileInput.addEventListener("change", async (evt) => {
        const file = evt.target.files?.[0];
        if (!file) return;

        try {
          const text = await file.text();
          const data = JSON.parse(text);
          loadQuestions(data, file.name);
        } catch (err) {
          el.statusLine.textContent = `Error al leer JSON: ${err.message}`;
        } finally {
          evt.target.value = "";
        }
      });

      el.clearHistoryBtn.addEventListener("click", () => {
        deleteCookie(HISTORY_COOKIE);
        renderHistory();
        el.historySummary.className = "empty";
        el.historySummary.textContent = "Selecciona una ejecucion para ver su resumen.";
      });
    }

    async function init() {
      wireEvents();
      renderHistory();
      try {
        await loadDefaultJson();
      } catch (err) {
        el.statusLine.textContent = err.message;
        el.quizPanel.hidden = true;
      }
    }

    init();
  </script>
</body>
</html>
